name: Feature request
about: Suggest a new feature or a change to this datapack
title: "[Feature] "
labels:
  - enhancement
body:
  - type: textarea
    id: description
    attributes:
      label: What should be added or changed?
    validations:
      required: true
  - type: textarea
    id: reason
    attributes:
      label: Why would this be useful?
    validations:
      required: false